[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantrisk-lab"
version = "1.0.0"
description = "Portfolio risk analytics, VaR, backtesting and stress testing."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "streamlit>=1.38",
    "plotly>=5.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
